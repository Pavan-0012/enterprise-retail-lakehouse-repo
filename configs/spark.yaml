spark:

  app_name: Enterprise Retail Lakehouse

  master: local[*]

  packages:
    - org.postgresql:postgresql:42.7.3
    - org.apache.hadoop:hadoop-aws:3.3.4
    - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.8.1
    - org.apache.iceberg:iceberg-aws-bundle:1.8.1

  configs:

    # ----------------------------------
    # Spark
    # ----------------------------------
    spark.sql.shuffle.partitions: "8"
    spark.sql.session.timeZone: "UTC"
    spark.driver.memory: "2g"
    spark.executor.memory: "2g"

    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    # ----------------------------------
    # Iceberg Catalog
    # ----------------------------------
    spark.sql.catalog.enterprise: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.enterprise.type: hadoop
    spark.sql.catalog.enterprise.warehouse: s3a://silver/
    spark.sql.catalog.enterprise.io-impl: org.apache.iceberg.aws.s3.S3FileIO

    # ----------------------------------
    # Iceberg S3 (MinIO)
    # ----------------------------------
    spark.sql.catalog.enterprise.s3.endpoint: http://localhost:9000
    spark.sql.catalog.enterprise.s3.path-style-access: "true"
    spark.sql.catalog.enterprise.s3.access-key-id: admin
    spark.sql.catalog.enterprise.s3.secret-access-key: password123
    spark.sql.catalog.enterprise.s3.region: us-east-1

    # ----------------------------------
    # AWS Region
    # ----------------------------------
    spark.driver.extraJavaOptions: "-Daws.region=us-east-1"
    spark.executor.extraJavaOptions: "-Daws.region=us-east-1"